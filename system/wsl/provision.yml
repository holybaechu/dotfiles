---
- name: Provision Arch Linux on WSL
  hosts: localhost
  connection: local
  # Keep provisioning commands on Bash when becoming the Fish login user.
  become_flags: '-s /bin/bash'
  vars:
    ansible_python_interpreter: /usr/bin/python
    linux_user: "{{ lookup('ansible.builtin.env', 'DOTFILES_LINUX_USER') | default('holybaechu', true) }}"
    repository: "{{ lookup('ansible.builtin.env', 'DOTFILES_REPOSITORY') | default('https://github.com/holybaechu/dotfiles.git', true) }}"

  pre_tasks:
    - name: Require root in Arch WSL and a non-root Linux username
      ansible.builtin.assert:
        that:
          - ansible_facts['user_uid'] == 0
          - ansible_facts['distribution'] == 'Archlinux'
          - "'microsoft' in (ansible_facts['kernel'] | lower)"
          - linux_user is match('^[a-z_][a-z0-9_-]{0,31}$')
          - linux_user != 'root'

    - name: Read the existing Linux account
      ansible.builtin.getent:
        database: passwd
        key: "{{ linux_user }}"
        fail_key: false

    - name: Reject an existing account with UID zero
      ansible.builtin.assert:
        that:
          - ansible_facts['getent_passwd'][linux_user] is none or (ansible_facts['getent_passwd'][linux_user][1] | int) != 0

    - name: Preserve the existing home directory
      ansible.builtin.set_fact:
        linux_home: "{{ ansible_facts['getent_passwd'][linux_user][4] if ansible_facts['getent_passwd'][linux_user] else '/home/' ~ linux_user }}"

  tasks:
    # Refresh signing keys before upgrading an older image. Keep the database
    # refresh and full upgrade together to avoid an Arch partial upgrade.
    - name: Refresh the Arch signing keys
      community.general.pacman:
        name: archlinux-keyring
        state: latest
        update_cache: true

    - name: Upgrade the Arch system
      community.general.pacman:
        upgrade: true

    - name: Install official repository packages
      community.general.pacman:
        name:
          - base-devel
          - chezmoi
          - curl
          - fastfetch
          - fish
          - git
          - github-cli
          - less
          - mise
          - neovim
          - openssh
          - ripgrep
          - starship
          - sudo
          - tree-sitter-cli
          - unzip
          - util-linux # provides more
        state: present

    - name: Create the Linux account and ensure wheel membership
      ansible.builtin.user:
        name: "{{ linux_user }}"
        home: "{{ linux_home }}"
        create_home: true
        groups: wheel
        append: true
        shell: /usr/bin/fish

    - name: Allow sudo with the Linux password
      ansible.builtin.copy:
        content: "{{ linux_user }} ALL=(ALL:ALL) ALL\n"
        dest: "/etc/sudoers.d/90-dotfiles-{{ linux_user }}"
        owner: root
        group: root
        mode: '0440'
        validate: /usr/bin/visudo --check --file %s

    # WSL owns Windows executable registration and protects binfmt_misc/status
    # from writes. Do not force systemd-binfmt to flush that registry.
    - name: Remove the obsolete WSL interop service override
      ansible.builtin.file:
        path: /etc/systemd/system/systemd-binfmt.service.d/10-wsl-interop.conf
        state: absent
      notify: Reload systemd

    - name: Reload systemd before checking WSL interop
      ansible.builtin.meta: flush_handlers

    # Chezmoi's Linux templates use Windows executables via WSL interop.
    - name: Verify WSL can run Windows executables
      ansible.builtin.command:
        # Disable AutoRun and avoid localized output that is not UTF-8, including
        # cmd's warning when launched from a Linux (UNC) working directory.
        argv: [/mnt/c/Windows/System32/cmd.exe, /d, /c, 'exit 0']
        chdir: /mnt/c/Windows
      changed_when: false
      check_mode: false

    - name: Check whether yay is installed
      ansible.builtin.stat:
        path: /usr/bin/yay
      register: yay_binary

    - name: Bootstrap yay for AUR use
      ansible.builtin.include_tasks: yay.yml
      when: not yay_binary.stat.exists

    - name: Configure the Linux user's dotfiles and mise tools
      become: true
      become_user: "{{ linux_user }}"
      become_method: su
      environment:
        HOME: "{{ linux_home }}"
        GIT_TERMINAL_PROMPT: '0'
      # A dry run cannot execute commands as an account it has not created.
      when: not ansible_check_mode or ansible_facts['getent_passwd'][linux_user] is not none
      block:
        - name: Check for an existing Linux chezmoi checkout
          ansible.builtin.stat:
            path: "{{ linux_home }}/.local/share/chezmoi/.git"
          register: chezmoi_checkout

        - name: Initialize chezmoi without pulling or replacing an existing checkout
          ansible.builtin.command:
            argv:
              - chezmoi
              - init
              - --force
              - --no-tty
              - "{{ repository }}"
            chdir: "{{ linux_home }}"
            creates: "{{ linux_home }}/.local/share/chezmoi/.git"

        - name: Preview pending dotfile changes
          ansible.builtin.command:
            argv: [chezmoi, diff, --no-tty]
            chdir: "{{ linux_home }}"
          register: chezmoi_diff
          changed_when: false
          check_mode: false
          when: not ansible_check_mode or chezmoi_checkout.stat.exists

        - name: Apply pending dotfile changes as the Linux user
          ansible.builtin.command:
            argv: [chezmoi, apply, --force, --no-tty]
            chdir: "{{ linux_home }}"
          when: chezmoi_diff.stdout | default('') | length > 0
          changed_when: true

        # An existing Linux checkout may predate the tools this playbook installs.
        # Apply only mise defaults from the provisioning checkout, preserving the
        # Linux checkout and unrelated keys through the shared modify template.
        - name: Preview the current provisioning defaults for mise
          ansible.builtin.command:
            argv:
              - chezmoi
              - --source
              - "{{ playbook_dir }}/../.."
              - diff
              - --no-tty
              - "{{ linux_home }}/.config/mise/config.toml"
            chdir: "{{ linux_home }}"
          register: mise_config_diff
          changed_when: false
          check_mode: false

        - name: Apply the current provisioning defaults for mise
          ansible.builtin.command:
            argv:
              - chezmoi
              - --source
              - "{{ playbook_dir }}/../.."
              - apply
              - --force
              - --no-tty
              - "{{ linux_home }}/.config/mise/config.toml"
            chdir: "{{ linux_home }}"
          when: mise_config_diff.stdout | length > 0
          changed_when: true

        - name: Install the configured Bun, Node.js LTS, and uv through mise
          ansible.builtin.shell: |
            set -e
            previous=$(mise ls --global --installed --json bun node uv)
            mise install bun node uv >&2
            current=$(mise ls --global --installed --json bun node uv)
            if [[ "$previous" != "$current" ]]; then
                printf '%s\n' changed
            else
                printf '%s\n' unchanged
            fi
            mise exec -- bun --version >&2
            mise exec -- node --version >&2
            mise exec -- npm --version >&2
            mise exec -- uv --version >&2
          args:
            executable: /bin/bash
            chdir: "{{ linux_home }}"
          register: runtime_install
          changed_when: runtime_install.stdout == 'changed'
          when: not ansible_check_mode

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true
