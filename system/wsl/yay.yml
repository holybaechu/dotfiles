---
- name: Install the yay build dependency
  community.general.pacman:
    name: go
    state: present

- name: Report the pending yay build in check mode
  ansible.builtin.debug:
    msg: yay will be built as the Linux user and installed as root.
  changed_when: true
  when: ansible_check_mode

- name: Build and install yay
  when: not ansible_check_mode
  block:
    - name: Create a temporary build directory owned by the Linux user
      ansible.builtin.tempfile:
        state: directory
        prefix: dotfiles-yay.
      become: true
      become_user: "{{ linux_user }}"
      become_method: su
      register: yay_build

    - name: Download the yay AUR source package
      ansible.builtin.git:
        repo: https://aur.archlinux.org/yay.git
        dest: "{{ yay_build.path }}"
        depth: 1
      become: true
      become_user: "{{ linux_user }}"
      become_method: su

    # All build dependencies are installed above. Keep makepkg unprivileged;
    # install the resulting package separately, without passwordless sudo.
    - name: Build yay as the Linux user
      ansible.builtin.command:
        argv: [makepkg, --noconfirm]
        chdir: "{{ yay_build.path }}"
      become: true
      become_user: "{{ linux_user }}"
      become_method: su
      environment:
        HOME: "{{ linux_home }}"
      changed_when: true

    - name: Locate the built yay package
      ansible.builtin.command:
        argv: [makepkg, --packagelist]
        chdir: "{{ yay_build.path }}"
      become: true
      become_user: "{{ linux_user }}"
      become_method: su
      changed_when: false
      register: yay_packages

    - name: Install the built yay package as root
      community.general.pacman:
        name: "{{ yay_packages.stdout_lines }}"
        state: present

  always:
    - name: Remove the temporary yay build directory
      ansible.builtin.file:
        path: "{{ yay_build.path }}"
        state: absent
      when: yay_build.path is defined
