- name: Configure the Linux desktop
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
    dotfiles_root: "{{ playbook_dir }}/../.."
    arch_packages: "{{ lookup('ansible.builtin.file', playbook_dir + '/packages.arch').splitlines() }}"
    aur_packages: "{{ lookup('ansible.builtin.file', playbook_dir + '/packages.aur').splitlines() }}"
    cider_fingerprint: A0CD6B993438E22634450CDD2A236C3F42A61682
    desktop_externals: "{{ lookup('ansible.builtin.file', dotfiles_root + '/home/.chezmoiexternal.yaml') | from_yaml }}"

  pre_tasks:
    - name: Require a normal user on Arch Linux
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == 'Archlinux'
          - ansible_facts['user_uid'] != 0
        fail_msg: Run bootstrap as your normal user on Arch Linux or a derivative.
      tags: always

  tasks:
    - name: Configure repositories and install packages
      ansible.builtin.import_tasks: tasks/packages.yml
      tags: packages

    - name: Configure desktop services
      ansible.builtin.import_tasks: tasks/services.yml
      tags: services

    - name: Install the SDDM theme and monitor configuration
      ansible.builtin.import_tasks: tasks/sddm.yml
      tags: sddm

    - name: Configure fingerprint authentication
      ansible.builtin.import_tasks: tasks/fingerprint.yml
      tags: fingerprint

    - name: Register this checkout with chezmoi
      ansible.builtin.command:
        argv: [chezmoi, init, --source, "{{ dotfiles_root }}"]
      changed_when: false
      tags: dotfiles

  handlers:
    - name: Restart fprintd
      become: true
      ansible.builtin.systemd_service:
        name: fprintd.service
        state: restarted
