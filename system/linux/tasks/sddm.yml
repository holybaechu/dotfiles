- name: Install the SDDM theme and monitor settings
  become: true
  block:
    - name: Create the SDDM installation directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - /usr/local/share/sddm/themes/canopy
        - /usr/local/libexec
        - /etc/sddm.conf.d

    - name: Install the Canopy theme files
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/sddm/canopy/{{ item }}"
        dest: "/usr/local/share/sddm/themes/canopy/{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop: [Main.qml, metadata.desktop, theme.conf]

    - name: Download the wallpaper shared with chezmoi
      ansible.builtin.get_url:
        url: "{{ desktop_externals['.local/share/backgrounds/canopy.jpg']['url'] }}"
        dest: /usr/local/share/sddm/themes/canopy/background.jpg
        owner: root
        group: root
        mode: '0644'
        force: true

    - name: Install the SDDM monitor helper
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/sddm/monitors.py"
        dest: /usr/local/libexec/sddm-canopy-monitors
        owner: root
        group: root
        mode: '0755'

    - name: Configure SDDM to use Canopy
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/sddm/sddm.conf"
        dest: /etc/sddm.conf.d/20-canopy.conf
        owner: root
        group: root
        mode: '0644'
