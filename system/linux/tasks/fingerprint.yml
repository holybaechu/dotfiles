- name: Configure password or fingerprint authentication
  become: true
  block:
    - name: Install the fingerprint PAM rules
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/{{ item.source }}"
        dest: "/etc/pam.d/{{ item.target }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - {source: pam-fingerprint, target: dotfiles-fingerprint}
        - {source: pam-sddm, target: dotfiles-sddm}

    - name: Create the local Polkit PAM configuration
      ansible.builtin.copy:
        src: /usr/lib/pam.d/polkit-1
        dest: /etc/pam.d/polkit-1
        remote_src: true
        force: false
        owner: root
        group: root
        mode: '0644'

    - name: Select the login authentication rules
      ansible.builtin.replace:
        path: "/etc/pam.d/{{ item.service }}"
        regexp: "^auth[ \\t]+include[ \\t]+{{ item.include }}[ \\t]*$"
        replace: "{{ item.rules }}"
      loop:
        - service: sddm
          include: system-login
          rules: |-
            auth required pam_shells.so
            auth requisite pam_nologin.so
            auth substack dotfiles-sddm
        - service: sudo
          include: system-auth
          rules: auth substack dotfiles-fingerprint
        - service: polkit-1
          include: system-auth
          rules: auth substack dotfiles-fingerprint

    - name: Update existing SDDM fingerprint configuration
      ansible.builtin.replace:
        path: /etc/pam.d/sddm
        regexp: '^auth[ \t]+substack[ \t]+dotfiles-fingerprint[ \t]*$'
        replace: auth substack dotfiles-sddm
