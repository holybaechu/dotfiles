<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>Monaspace Neon NF</family>
      <family>Noto Sans Mono CJK KR</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>Monaspace Neon NF</family>
    <accept>
      <family>Noto Sans Mono CJK KR</family>
    </accept>
  </alias>
</fontconfig>
