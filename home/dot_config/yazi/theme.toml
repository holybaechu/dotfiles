# Canopy colors; keep terminal transparency and Yazi's file-type defaults.
[mgr]
cwd = { fg = "#bfdc96" }
border_style = { fg = "#849575" }
count_copied = { fg = "#11160f", bg = "#bfdc96" }
count_cut = { fg = "#11160f", bg = "#eea99a" }
count_selected = { fg = "#11160f", bg = "#ebc98a" }

[indicator]
parent = { fg = "#f0f3e7", bg = "#3c502b", reversed = false }
current = { fg = "#f0f3e7", bg = "#3c502b", reversed = false }

[tabs]
active = { fg = "#11160f", bg = "#7cab3d", bold = true }
inactive = { fg = "#aab69e", bg = "#293522" }

[mode]
normal_main = { fg = "#11160f", bg = "#7cab3d", bold = true }
normal_alt = { fg = "#f0f3e7", bg = "#293522" }
select_main = { fg = "#11160f", bg = "#ebc98a", bold = true }
select_alt = { fg = "#ebc98a", bg = "#293522" }
unset_main = { fg = "#11160f", bg = "#eea99a", bold = true }
unset_alt = { fg = "#eea99a", bg = "#293522" }

[status]
progress_normal = { fg = "#7cab3d", bg = "#293522" }
progress_error = { fg = "#11160f", bg = "#eea99a" }
