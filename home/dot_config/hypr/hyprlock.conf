auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint to unlock
        present_message = Scanning...
    }
}

background {
    monitor =
    path = ~/.local/share/backgrounds/canopy.jpg
    blur_passes = 3
    color = rgb(11160f)
}

input-field {
    monitor =
    size = 300, 56
    position = 0, -80
    halign = center
    valign = center
    outline_thickness = 2
    outer_color = rgb(7cab3d)
    inner_color = rgb(11160f)
    font_color = rgb(f0f3e7)
    check_color = rgb(bfdc96)
    fail_color = rgb(eea99a)
    font_family = Inter
    placeholder_text = Enter password
}

label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = Inter
    color = rgb(f0f3e7)
    position = 0, 80
    halign = center
    valign = center
}
