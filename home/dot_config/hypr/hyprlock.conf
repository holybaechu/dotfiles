auth {
    fingerprint {
        enabled = true
        ready_message = Scan your finger or enter your password
        present_message = Scanning…
    }
}

background {
    monitor =
    path = ~/.local/share/backgrounds/canopy.jpg
    blur_passes = 0
    noise = 0
    contrast = 1
    brightness = 0.86
    vibrancy = 0
    color = rgb(11160f)
}

input-field {
    monitor =
    size = 332, 52
    position = 9%, 13%
    halign = left
    valign = bottom
    outline_thickness = 0
    rounding = 0
    inner_color = rgba(11160f00)
    font_color = rgb(f0f3e7)
    check_color = rgb(bfdc96)
    fail_color = rgb(eea99a)
    font_family = Inter
    placeholder_text = Password
    check_text = Checking…
    fail_text = $PAMFAIL$FPRINTFAIL
    fade_on_empty = false
    dots_center = false
    dots_size = 0.15
    dots_spacing = 0.4
}

# A quiet underline replaces the filled password box.
shape {
    monitor =
    size = 332, 1
    position = 9%, 13%
    halign = left
    valign = bottom
    color = rgba(7cab3de6)
}

label {
    monitor =
    text = cmd[update:1000] date '+<span font_family="Inter Light" size="79872" letter_spacing="-4096">%H:%M</span>%n<span foreground="##aab69e" letter_spacing="307">%A, %-d %B</span>'
    font_size = 11
    font_family = Inter
    color = rgb(f0f3e7)
    position = -9%, -8%
    halign = right
    valign = top
    text_align = right
}

label {
    monitor =
    text = $USER
    font_size = 25
    font_family = Inter Medium
    color = rgb(f0f3e7)
    position = 9%, 22%
    halign = left
    valign = bottom
}

label {
    monitor =
    text = $FPRINTPROMPT
    font_size = 10
    font_family = Inter
    color = rgb(aab69e)
    position = 9%, 8%
    halign = left
    valign = bottom
}
