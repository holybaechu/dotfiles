; Alt + left-drag moves; Alt + right-drag resizes.
; komorebi owns tiling and snapping. Reload AltSnap after applying changes.

[General]
AutoFocus=1
Aero=0
SmartAero=0
AutoSnap=0
StickyResize=0
ResizeCenter=3

[Input]
Hotkeys=A4 A5
KeyCombo=0
LMB=Move
RMB=Resize
MMB=Nothing
MB4=Nothing
MB5=Nothing
Scroll=Nothing
HScroll=Nothing
TTBActions=0
; Preserve Alt+Tab and Ctrl+Alt+Delete; suppress menus after a drag.
Killkeys=09 2E
EndSendKey=FF

[Advanced]
; Notify komorebi when a mouse move/resize starts and ends.
NotifyWinEvent=1
ResizeAll=1
FullScreen=0
AlwaysElevate=0

; Retain AltSnap 1.68's application and shell exclusions.
[Blacklist]
Processes=StartMenuExperienceHost.exe,SearchApp.exe,mstsc.exe,msrdc.exe,osk.exe,Virtual PC.exe,LeagueClient.exe,LeagueClientUx.exe,LeagueClientUxRender.exe
; Keep Alt-clicks in Canopy's bar, panels, launcher, and native preview.
Windows=Program Manager|Progman,*|MultitaskingViewFrame,Volume Control|Tray Volume,*|TaskSwitcherWnd,*|TaskSwitcherOverlayWnd,|WorkerW,|Shell_TrayWnd,|BaseBar,|#32768,*|XamlExplorerHostIslandWindow,|MozillaDropShadowWindowClass,*|VistaSwitcher_SwitcherWnd,|TaskListThumbnailWnd,|NotifyIconOverflowWindow,*|Windows.UI.Core.CoreWindow,|NativeHWNDHost,*|Xaml_WindowedPopupClass,|Shell_SecondaryTrayWnd,*|SimpleWindowSwitcher_{BEA057BB-66C7-4758-A610-FAE6013E9F98},yui.exe:Yui|YuiWnd,YasbBar|*,Canopy panel|*,Canopy launcher|*,Canopy native preview|*
Scroll=
IScroll=*|ApplicationFrameWindow
MDIs=*|PPTFrameClass,*|MMCMainFrame,*|classFoxitReader
Pause=taskmgr.exe,explorer.exe,dwm.exe,Virtual PC.exe,AltSnap.exe
Snaplist=*|BaseWindow_RootWnd,*|SkinWnd,*|ChatSkinWnd,*|SpotifyMainWindow,*|USurface_*,*|Winamp*,*|M4W_MainWindow,*|SunAwtDialog
MMBLower=*|CASCADIA_HOSTING_WINDOW_CLASS,*|MozillaDialogClass
AResize=*|SunAwtDialog
NResize=
SSizeMove=*|iTunes
NCHittest=*|ApplicationFrameWindow
Bottommost=*|RainmeterMeterWindow
